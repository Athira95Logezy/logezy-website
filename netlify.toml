[build]
  command = "npm run build"
  publish = "dist"

# Force www canonical domain
[[redirects]]
  from = "https://logezy.com/*"
  to = "https://www.logezy.com/:splat"
  status = 301
  force = true

# Allow Google verification file to bypass SPA catch-all
[[redirects]]
  from = "/google596fef10a41501ba.html"
  to = "/google596fef10a41501ba.html"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
